plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.spring.javaformat' version '0.0.35'
}

group = "${project_group}"
version = "${project_version}"

sourceCompatibility = "${java_compatibility_version}"
targetCompatibility = "${java_compatibility_version}"

repositories {
    mavenCentral()
}

dependencies {
    implementation "com.googlecode.libphonenumber:libphonenumber:${google_libphonenumber}"
    implementation "org.apache.tika:tika-core:${tika_version}"
    implementation "org.apache.commons:commons-csv:${commons_csv_version}"
    api "org.apache.poi:poi:${apache_poi_version}"
    testImplementation "org.apache.poi:poi-ooxml:${apache_poi_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junit_jupiter_version}"
    testImplementation "org.assertj:assertj-core:${assertj_version}"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Common Utilities'
                description = 'Common utility library'
            }
        }
    }

    repositories {
        mavenLocal()
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
